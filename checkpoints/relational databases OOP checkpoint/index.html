<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>OOP Shopping Cart</title>
	</head>
	<body>
		<header>
			<h1>OOP Shopping Cart</h1>
		</header>

		<main>
			<section>
				<h2>Products</h2>
				<div id="product-list" class="product-list"></div>
			</section>

			<section class="cart">
				<h2>Cart</h2>
				<ul id="cart-items" class="cart-items"></ul>
				<div class="totals">
					<p>Total items: <strong id="total-items">0</strong></p>
					<p>Total price: <strong id="total-price">0 $</strong></p>
				</div>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
